# Generic mailwake configuration example.
#
# Replace every path and command with values for your own machine before
# running the daemon. The Gmail/IMAP recipe lives in gmail.example.toml.

default_debounce_seconds = 10
default_max_debounce_seconds = 60
command_timeout_seconds = 300
command_output_max_bytes = 1048576
command_output_tail_lines = 100
min_command_interval_seconds = 60

[[commands]]
name = "refresh-state"
lane = "example-maintenance"
cmd = "/home/alice/.local/bin/refresh-example-state"
timeout_seconds = 300
min_interval_seconds = 60
output_mode = "failure_tail"
output_tail_lines = 100

# Filesystem events are wake-up signals. state_cmd produces an opaque value;
# mailwake runs refresh-state only after that value changes.
[[sources]]
name = "local-state"
type = "fs_state"
watch_paths = ["/home/alice/.local/state/example"]
recursive = false
state_cmd = "cat /home/alice/.local/state/example/version"
on_change = "refresh-state"
run_on_startup = false
debounce_seconds = 5
max_debounce_seconds = 60

# Optional on Linux systems using systemd/logind: run the same reconciliation
# command after the machine resumes from sleep.
