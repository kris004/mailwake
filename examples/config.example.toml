#
# [[sources]]
# name = "remote-imap-inbox"
# type = "imap_idle"
# account = "example-imap"
# mailbox = "INBOX"
# on_event = "remote-sync"
# run_on_startup = true
# debounce_seconds = 10

[[sources]]
name = "system-resume"
type = "system_resume"
on_resume = "remote-sync"
settle_seconds = 20

[[sources]]
name = "local-state"
type = "fs_state"
watch_paths = ["/home/alice/.mail/example/.notmuch"]
recursive = false
state_cmd = "cd /home/alice/.mail/example && notmuch count --lastmod"
on_change = "local-push"
run_on_startup = false
debounce_seconds = 5
max_debounce_seconds = 60
