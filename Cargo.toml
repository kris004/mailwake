[package]
name = "mailwake"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Tiny IMAP IDLE daemon that runs commands on mailbox changes"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-native-tls = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
