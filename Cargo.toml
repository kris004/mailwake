[package]
name = "mailwake"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.95"
description = "Event-driven Unix daemon that runs commands when configured sources change"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/kris004/mailwake"
publish = false
keywords = ["automation", "daemon", "file-watcher", "imap", "systemd"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
native-tls = "0.2"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-native-tls = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
