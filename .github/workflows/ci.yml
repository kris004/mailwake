name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          clean: true
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Run Clippy
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo +stable test --locked

      - name: Verify third-party license notices
        run: |
          set -euo pipefail

          about_version=0.9.1
          about_archive="${RUNNER_TEMP}/cargo-about.tar.gz"
          about_directory="${RUNNER_TEMP}/cargo-about-${about_version}-x86_64-unknown-linux-musl"
          generated="${RUNNER_TEMP}/THIRD_PARTY_LICENSES.html"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${about_version}/cargo-about-${about_version}-x86_64-unknown-linux-musl.tar.gz" \
            -o "$about_archive"
          echo "c0e7dc6f5d74b0beec5c0053d39ab24514c717d19acd91886907a22457ea9e98  $about_archive" \
            | sha256sum --check -
          tar -xzf "$about_archive" -C "$RUNNER_TEMP"
          cargo +stable fetch --locked

          "$about_directory/cargo-about" generate \
            --frozen \
            --all-features \
            --fail \
            --output-file "$generated" \
            about.hbs
          sed -i 's/\r$//' "$generated"
          if ! cmp -s THIRD_PARTY_LICENSES.html "$generated"; then
            diff -u THIRD_PARTY_LICENSES.html "$generated"
            exit 1
          fi

      - name: Verify public install and systemd targets
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mailwake-target
        run: |
          prefix="${RUNNER_TEMP}/mailwake-prefix"
          units="${RUNNER_TEMP}/mailwake-units"
          make CARGO="cargo +stable" PREFIX="$prefix" install
          "$prefix/bin/mailwake" --version
          make PREFIX="$prefix" SYSTEMD_USER_DIR="$units" install-systemd
          systemd-analyze --user verify "$units/mailwake.service"
          make PREFIX="$prefix" SYSTEMD_USER_DIR="$units" install-systemd-hardened
          systemd-analyze --user verify "$units/mailwake.service"

      - name: Check shell helper syntax
        run: sh -n contrib/oauth/gmail-oauth-token-oauth2l

      - name: Lint shell helper
        run: shellcheck contrib/oauth/gmail-oauth-token-oauth2l

      - name: Verify package contents
        run: cargo +stable package --locked

  msrv:
    name: Rust 1.95 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          clean: true
          persist-credentials: false

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Check all targets
        run: cargo +1.95.0 check --all-targets --all-features --locked
